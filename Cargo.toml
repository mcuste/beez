[workspace]
members = [
  "crates/loom-core",
  "crates/loom-process",
  "crates/loom-sandbox",
  "crates/loom-manifest",
  "crates/loom-runner",
  "crates/loom-cli",
  "crates/loom-test-support",
]
default-members = ["crates/loom-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/mcuste/loom"

[workspace.dependencies]
clap = { version = "4.6.6", features = ["derive"] }
loom-process = { path = "crates/loom-process" }
loom-test-support = { path = "crates/loom-test-support" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
unreachable = "deny"
indexing_slicing = "deny"
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "deny"
allow_attributes = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
await_holding_lock = "deny"
async_yields_async = "deny"
large_futures = "warn"
as_conversions = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
integer_division = "deny"

[workspace.metadata.cargo-machete]
ignored = []

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true
