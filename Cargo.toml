[workspace]
members = [
  "crates/loom-core",
  "crates/loom-process",
  "crates/loom-cli",
]
default-members = ["crates/loom-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/mcuste/loom"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
