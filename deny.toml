[graph]
all-features = true
exclude-dev = true
# Loom runs on macOS and Linux, so the graph leaves out other targets and the
# dependencies they alone pull in.
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
]

[advisories]
yanked = "deny"
unmaintained = "all"
unsound = "all"
maximum-db-staleness = "P3D"
unused-ignored-advisory = "deny"

[licenses]
confidence-threshold = 0.93
private = { ignore = true }
unused-allowed-license = "deny"
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]

[bans]
multiple-versions = "allow"
deny = [
  { crate = "openssl", use-instead = "rustls" },
  { crate = "openssl-sys", use-instead = "rustls" },
  { crate = "cmake", use-instead = "cc" },
]

[bans.build]
executables = "deny"
interpreted = "deny"
enable-builtin-globs = true
include-dependencies = true
include-workspace = false
# libc ships a maintainer script that its build never runs.
bypass = [{ crate = "libc", allow-globs = ["etc/*.py"] }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
unused-allowed-source = "deny"
