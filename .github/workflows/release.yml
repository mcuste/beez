name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/check-version.py "${GITHUB_REF_NAME}"

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --package loom-cli --target ${{ matrix.target }}
      - id: archive
        env:
          TARGET: ${{ matrix.target }}
        run: |
          asset="loom-${GITHUB_REF_NAME}-${TARGET}.tar.gz"
          tar -czf "${asset}" -C "target/${TARGET}/release" loom
          echo "asset=${asset}" >> "${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archive.outputs.asset }}
          path: ${{ steps.archive.outputs.asset }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - working-directory: dist
        run: shasum -a 256 loom-* > SHA256SUMS
      - run: python3 scripts/release-notes.py "${GITHUB_REF_NAME}" > release-notes.md
      - env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          --title "${GITHUB_REF_NAME}"
          --notes-file release-notes.md
          dist/loom-*
          dist/SHA256SUMS
