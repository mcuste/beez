name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/check-version.py "${GITHUB_REF_NAME}"

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --package beez --target ${{ matrix.target }}
      - id: archive
        env:
          TARGET: ${{ matrix.target }}
        run: |
          asset="beez-${GITHUB_REF_NAME}-${TARGET}.tar.gz"
          tar -czf "${asset}" -C "target/${TARGET}/release" beez
          echo "asset=${asset}" >> "${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archive.outputs.asset }}
          path: ${{ steps.archive.outputs.asset }}
          if-no-files-found: error

  crates:
    name: Publish to crates.io
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --workspace --locked

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - working-directory: dist
        run: shasum -a 256 beez-* > SHA256SUMS
      - run: python3 scripts/release-notes.py "${GITHUB_REF_NAME}" > release-notes.md
      - env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          --title "${GITHUB_REF_NAME}"
          --notes-file release-notes.md
          dist/beez-*
          dist/SHA256SUMS

  homebrew:
    name: Update Homebrew tap
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: mcuste/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
      - env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${GITHUB_REF_NAME}" --pattern SHA256SUMS
      - run: |
          mkdir -p homebrew-tap/Formula
          python3 scripts/homebrew-formula.py "${GITHUB_REF_NAME}" SHA256SUMS > homebrew-tap/Formula/beez.rb
      - working-directory: homebrew-tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/beez.rb
          git commit -m "beez ${GITHUB_REF_NAME}"
          git push
