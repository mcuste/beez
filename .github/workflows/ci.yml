name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Verify on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      # The Linux sandbox and its tests need bubblewrap.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      # AppArmor on Ubuntu 24.04 denies CAP_NET_ADMIN inside an unprivileged
      # user namespace, so bwrap cannot bring up loopback without this.
      - if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - id: cargo-tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/cargo-machete
            ~/.cargo/bin/just
          key: ${{ runner.os }}-cargo-tools-deny-0.20.2-machete-0.9.1-just-1.58.0
      - if: steps.cargo-tools.outputs.cache-hit != 'true'
        run: |
          cargo install cargo-deny --version 0.20.2 --locked
          cargo install cargo-machete --version 0.9.1 --locked
          cargo install just --version 1.58.0 --locked
      - run: just verify

  metadata:
    name: Validate release metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/check-version.py
